# Bestand-Abgleich jeden Morgen (T2.2). Seit dem Go-Live (24.10.2026) baut Cloudflare (Workers Builds)
# bei jedem Commit selbst; dieser Workflow gleicht dann nur ab und committet. Build und Deploy hier
# nur mit der Variable HOSTING (github-pages oder cloudflare), siehe unten.
#
# 04:17 UTC = 06:17 Luxemburger Sommerzeit, 05:17 Winterzeit. Die krumme Minute umgeht
# die Staus zur vollen Stunde; GitHub kann den Start verzögern, das ist in Ordnung.
#
# Der tägliche Commit von sync-status.json ist Absicht: GitHub schaltet geplante Workflows
# in öffentlichen Repositories nach 60 Tagen ohne Aktivität ab.
name: Bestand-Sync und Deploy

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: stock-sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Quelle: MovingCar-API (Secret MOVINGCAR_API_KEY, Variable MOVINGCAR_AUTH=basic).
      # Bei einem Push wird nur gebaut, der Bestand bleibt wie im Repository.
      - name: Bestand abgleichen (MovingCar)
        id: sync
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          MOVINGCAR_API_KEY: ${{ secrets.MOVINGCAR_API_KEY }}
          MOVINGCAR_AUTH: ${{ vars.MOVINGCAR_AUTH }}
          MOVINGCAR_PARTNER_ID: ${{ vars.MOVINGCAR_PARTNER_ID }}
          MOVINGCAR_VEHICLES: ${{ vars.MOVINGCAR_VEHICLES }}
        run: npm run sync

      # Supabase pausiert Projekte im Free-Plan nach 7 Tagen ohne Zugriff (Login und Formulare
      # gingen dann nicht mehr). Eine kleine Anfrage am Tag hält es aktiv. Ohne Supabase: übersprungen.
      - name: Supabase aktiv halten
        if: github.event_name == 'schedule' && vars.PUBLIC_SUPABASE_URL != ''
        continue-on-error: true
        env:
          SB_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -o /dev/null "$SB_URL/rest/v1/admin_changes?select=id&limit=1" -H "apikey: $SB_KEY"

      - name: Tests
        run: npm test

      - name: Bestand und Status committen
        if: github.event_name != 'push' && always()
        run: |
          git config user.name "rondpoint-stock-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sync-status.json src/data/stock.json
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Bestand-Sync $(date -u +%Y-%m-%d)"
            # inzwischen gespeichert (z. B. aus dem Admin-Bereich)? Darauf aufsetzen statt abzubrechen
            git pull --rebase --quiet origin main
            git push
          fi

      - name: Issue „Bestand-Sync fehlgeschlagen" anlegen oder aktualisieren
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Bestand-Sync fehlgeschlagen"
          BODY_FILE=sync-report.md
          [ -f "$BODY_FILE" ] || echo "Kein Bericht erzeugt. Siehe Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$BODY_FILE"
          echo -e "\n\nLauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$BODY_FILE"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Bild-Cache wiederherstellen
        if: steps.sync.outcome != 'failure' && vars.HOSTING != ''
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ github.run_id }}
          restore-keys: astro-images-

      # Wohin veröffentlicht wird, bestimmt die Variable HOSTING:
      #  - nicht gesetzt:  nirgends; Cloudflare Workers Builds baut bei jedem Commit (heutiger Weg)
      #  - github-pages:   GitHub Pages (Adresse und Basis-Pfad von configure-pages)
      #  - cloudflare:     Cloudflare Worker über GitHub Actions (Adresse aus der Variable SITE_URL), siehe README → „Cloudflare“
      - uses: actions/configure-pages@v5
        id: pages
        if: steps.sync.outcome != 'failure' && vars.HOSTING == 'github-pages'

      - name: Build
        if: steps.sync.outcome != 'failure' && vars.HOSTING != ''
        env:
          PUBLIC_HOSTING: ${{ vars.HOSTING }}
          PUBLIC_INQUIRY_URL: ${{ vars.PUBLIC_INQUIRY_URL }}
          # Admin-Bereich auf der Seite: Cloudflare (HOSTING=cloudflare), Supabase (diese beiden Variablen) oder Demo
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.HOSTING == 'cloudflare' && vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.HOSTING != 'cloudflare' && steps.pages.outputs.base_path || '' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outcome != 'failure' && vars.HOSTING == 'github-pages'
        with:
          path: dist

      - name: Deploy
        id: deploy
        if: steps.sync.outcome != 'failure' && vars.HOSTING == 'github-pages'
        uses: actions/deploy-pages@v4

      # Cloudflare: Datenbank-Tabellen anlegen bzw. ergänzen, Worker mit den Seiten hochladen,
      # Geheimnisse des Workers aus den GitHub-Secrets setzen.
      - name: Auf Cloudflare veröffentlichen
        if: steps.sync.outcome != 'failure' && vars.HOSTING == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          EDITOR_GITHUB_TOKEN: ${{ secrets.EDITOR_GITHUB_TOKEN }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.jsonc; fi
          npx --yes wrangler@4 d1 migrations apply rondpoint --remote
          npx --yes wrangler@4 deploy
          node -e 'const s={};if(process.env.SESSION_SECRET)s.SESSION_SECRET=process.env.SESSION_SECRET;if(process.env.EDITOR_GITHUB_TOKEN)s.GITHUB_TOKEN=process.env.EDITOR_GITHUB_TOKEN;require("fs").writeFileSync(process.env.RUNNER_TEMP+"/cf-secrets.json",JSON.stringify(s))'
          if [ "$(cat "$RUNNER_TEMP/cf-secrets.json")" != "{}" ]; then npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/cf-secrets.json"; fi
          rm -f "$RUNNER_TEMP/cf-secrets.json"

      - name: Abbruch melden
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Bestand-Sync fehlgeschlagen. stock.json bleibt unverändert, die Website zeigt den letzten guten Stand."
          exit 1
